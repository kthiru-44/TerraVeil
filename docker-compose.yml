version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/terraveil.db:/app/terraveil.db
      - ./backend/static:/app/static

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
